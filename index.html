<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f28c28"><title>簡單記帳</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><h1>簡單記帳</h1><div class="actions"><button id="export" type="button">匯出</button><label class="import">匯入<input id="import" type="file" accept="application/json"></label><button id="accounts" type="button">帳戶</button></div></header><nav><button type="button" data-view="day">日</button><button type="button" class="active" data-view="month">月</button><button type="button" data-view="year">年</button></nav><section id="summary" class="summary"></section><section class="period"><button id="prev" type="button">‹</button><strong id="periodLabel"></strong><button id="next" type="button">›</button></section><section id="calendar" class="calendar"></section><section id="list"></section><button id="add" type="button" class="fab">＋ 記一筆</button></main><dialog id="editor"><form method="dialog"><h2 id="editorTitle">新增紀錄</h2><input id="title" required placeholder="項目"><input id="amount" required type="number" min="0" placeholder="金額"><select id="kind"><option value="expense">支出</option><option value="income">收入</option><option value="transfer">轉帳</option></select><input id="date" type="date"><select id="account"></select><select id="destination" hidden></select><div class="dialog-actions"><button type="button" value="cancel" onclick="document.querySelector('#editor').close()">取消</button><button id="save" type="button">儲存</button></div></form></dialog><dialog id="accountDialog"><form method="dialog"><h2>帳戶與餘額</h2><div id="accountList"></div><input id="accountName" placeholder="新增帳戶名稱"><select id="accountKind"><option value="wallet">錢包</option><option value="bank">銀行</option><option value="creditCard">信用卡</option></select><button id="addAccount" type="button">新增帳戶</button><button type="button" value="cancel" onclick="document.querySelector('#accountDialog').close()">完成</button></form></dialog><script src="./app.js?v=20261010-3"></script></body></html>
